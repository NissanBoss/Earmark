name: Release

# Tagging a version (git tag v1) builds the five packages and puts them on
# the Releases page.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # build.sh is the same script used to build by hand, called rather
      # than copied. It already checks formatting, runs vet and runs the
      # tests before compiling anything, so none of that is repeated here.
      # GITHUB_REF_NAME is the tag, and it is what "earmark --version"
      # ends up printing.
      - name: Build the packages
        run: |
          sh build.sh
          ls -lh dist/*.zip dist/*.tar.gz

      # The release text comes from CHANGELOG.md, from the section whose
      # heading matches this tag exactly. No section, no notes: better than
      # the same generic paragraph on every version.
      - name: Prepare the release notes
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v wanted="## $GITHUB_REF_NAME" '
              $0 == wanted { inside = 1; next }
              /^## / { inside = 0 }
              inside { print }
            ' CHANGELOG.md > notes.md
          fi
          touch notes.md
          cat >> notes.md <<'END'

          ## Download

          Take the package for your system, unpack it, and run the binary.
          There is nothing to install.

          | System | Package |
          |---|---|
          | Windows | `earmark-windows.zip` |
          | Linux | `earmark-linux.tar.gz` |
          | Linux on ARM | `earmark-linux-arm.tar.gz` |
          | Mac with Apple silicon | `earmark-mac-apple.tar.gz` |
          | Mac with Intel | `earmark-mac-intel.tar.gz` |

          Give it a project: a built site, an app, a package, a repository.
          It says which identifiers in it belong to an account, which of
          them name the account outright, and with --against, which it
          shares with another project of yours.

          It only reads. Nothing is written, and nothing is looked up or
          sent anywhere.
          END
          echo "--- notes ---"
          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/earmark-windows.zip
            dist/earmark-linux.tar.gz
            dist/earmark-linux-arm.tar.gz
            dist/earmark-mac-apple.tar.gz
            dist/earmark-mac-intel.tar.gz
          body_path: notes.md
